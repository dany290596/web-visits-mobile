<div class="wv-navbar">
    <div class="wv-topbar">
        <!-- Botón de menú (solo móvil) -->
        <button (click)="toggleMobileMenu()" type="button" class="wv-icon-btn wv-only-mobile" aria-expanded="false"
            aria-label="Abrir menú">
            <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-5 w-5'"></svg-icon>
        </button>

        <img src="logo.png" alt="WebVisitsMobile" class="wv-topbar-logo" />
        <span class="wv-divider-v"></span>
        <span class="wv-topbar-title">WebVisitsMobile</span>

        <div class="wv-topbar-right">
            <app-profile-menu></app-profile-menu>
        </div>
    </div>

    <!-- Menú móvil: el componente maneja su propio estado; en escritorio se oculta por CSS -->
    <div class="wv-mobile-menu">
        <app-navbar-mobile></app-navbar-mobile>
    </div>
</div>
