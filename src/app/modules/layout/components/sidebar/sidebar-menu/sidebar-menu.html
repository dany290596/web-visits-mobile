@for (menu of menuService.pagesMenu; track menu) {
<div>
    @if (menuService.showSideBar) {
    <small class="wv-group-label">{{ menu.group }}</small>
    }

    <ul class="flex flex-col">
        @for (item of menu.items; track item) {
        <li>
            <!-- Módulo -->
            <div (click)="toggleMenu(item)" class="wv-mod"
                [ngClass]="{ 'is-active': item.active, 'is-open': item.expanded }">

                <span class="wv-tile">
                    <svg-icon src="{{ item.icon }}" [svgClass]="'h-4 w-4'"></svg-icon>
                </span>

                <ng-container [ngTemplateOutlet]="item.children ? childMenu : parentMenu"
                    [ngTemplateOutletContext]="{ item: item }">
                </ng-container>

                <!-- Con ruta -->
                <ng-template #parentMenu let-item="item">
                    <a routerLink="{{ item.route }}" routerLinkActive="wv-mod-label"
                        [ngClass]="{ hidden: !menuService.showSideBar }" class="wv-mod-label">
                        {{ item.label }}
                    </a>
                </ng-template>

                <!-- Con hijos -->
                <ng-template #childMenu let-item="item">
                    <span [ngClass]="{ hidden: !menuService.showSideBar }" class="wv-mod-label">
                        {{ item.label }}
                    </span>
                </ng-template>

                @if (item.children && menuService.showSideBar) {
                <span class="wv-chevron">
                    <svg-icon src="assets/icons/heroicons/solid/chevron-right.svg"
                        [svgClass]="'h-3 w-3 rotate-90'"></svg-icon>
                </span>
                }
            </div>

            <!-- Secciones -->
            <app-sidebar-submenu [submenu]="item"></app-sidebar-submenu>
        </li>
        }
    </ul>
</div>
}
