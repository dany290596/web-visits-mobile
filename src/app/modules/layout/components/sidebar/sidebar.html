<nav class="wv-sidebar hidden lg:flex" [ngClass]="{ 'is-collapsed': !menuService.showSideBar }">
    <div class="wv-sidebar-head">
        <img src="logo.png" alt="WebVisitsMobile" class="wv-brand-logo" (click)="toggleSidebar()" />

        @if (menuService.showSideBar) {
        <div class="min-w-0">
            <div class="wv-brand-name">{{ appJson.displayName }}</div>
            <div class="wv-brand-role">Panel de administración</div>
        </div>
        }

        <button type="button" class="wv-rail-btn" (click)="toggleSidebar()"
            [ngClass]="{ 'is-flipped': !menuService.showSideBar }">
            <svg-icon src="assets/icons/heroicons/solid/chevron-double-left.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </button>
    </div>

    <div class="wv-nav">
        <app-sidebar-menu></app-sidebar-menu>
    </div>

    <div class="wv-sidebar-foot">
        @if (menuService.showSideBar) {
        <span class="wv-foot-text">{{ appJson.displayName }}</span>
        }
        <span class="wv-version">V{{ appJson.version }}</span>
    </div>
</nav>
